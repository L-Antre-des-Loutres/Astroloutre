server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Derrière le reverse proxy : redirections relatives (/profil/x -> /profil/x/) sans le port interne
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fichiers générés par Astro : leur nom contient un hash, on peut les garder longtemps
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Page 404 générée par Astro (src/pages/404.astro)
    error_page 404 /404.html;
}
